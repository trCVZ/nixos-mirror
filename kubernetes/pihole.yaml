apiVersion: v1
kind: Namespace
metadata:
  name: pihole

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-data
  namespace: pihole
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1

  selector:
    matchLabels:
      app: pihole

  template:
    metadata:
      labels:
        app: pihole

    spec:
      containers:
        - name: pihole
          image: pihole/pihole:2026.07.2

          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP

            - name: dns-udp
              containerPort: 53
              protocol: UDP

            - name: https
              containerPort: 443
              protocol: TCP

          env:
            - name: TZ
              value: "Europe/Paris"

            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: password

            - name: FTLCONF_webserver_domain
              value: "pihole.calenti.home"

            - name: FTLCONF_webserver_port
              value: "443s"

            - name: FTLCONF_dns_listeningMode
              value: "ALL"

            - name: FTLCONF_dns_upstreams
              value: "1.1.1.3;1.0.0.3"

            - name: FTLCONF_misc_dnsmasq_lines
              value: "address=/pihole.calenti.home/192.168.1.100"

          volumeMounts:
            - name: pihole-data
              mountPath: /etc/pihole

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 300m
              memory: 192Mi

      volumes:
        - name: pihole-data
          persistentVolumeClaim:
            claimName: pihole-data

---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: pihole
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local

  selector:
    app: pihole

  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP

    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP

    - name: https
      port: 443
      targetPort: 443
      protocol: TCP